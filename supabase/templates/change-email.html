<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head>
    <link rel="preload" as="image" href="{{ .SiteURL }}/logo.png" />
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="x-apple-disable-message-reformatting" />
  </head>
  <body style="background-color:#09090b;margin:0;padding:0">
    <!--$-->
    <table
      border="0"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      align="center">
      <tbody>
        <tr>
          <td
            style='background-color:#09090b;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;margin:0;padding:0'>
            <table
              align="center"
              width="100%"
              border="0"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
              style="max-width:520px;margin:0 auto;padding:40px 20px 56px">
              <tbody>
                <tr style="width:100%">
                  <td>
                    <table
                      align="center"
                      width="100%"
                      border="0"
                      cellpadding="0"
                      cellspacing="0"
                      role="presentation"
                      style="text-align:left;margin-bottom:40px">
                      <tbody>
                        <tr>
                          <td>
                            <img
                              alt="Blabber"
                              height="32"
                              src="{{ .SiteURL }}/logo.png"
                              style="display:block;outline:none;border:none;text-decoration:none;margin:0;max-width:140px;height:auto"
                              width="140" />
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <h1
                      style="color:#fafafa;font-size:22px;font-weight:600;line-height:28px;margin:0 0 20px;text-align:left">
                      Confirm email change
                    </h1>
                    <p
                      style="font-size:15px;line-height:24px;color:#a1a1aa;margin:0 0 20px;margin-top:0;margin-right:0;margin-bottom:20px;margin-left:0">
                      Confirm that you want to use<!-- -->
                      <span style="color:#e4e4e7">{{ .NewEmail }}</span> as the
                      email for your account.
                    </p>
                    <table
                      align="center"
                      width="100%"
                      border="0"
                      cellpadding="0"
                      cellspacing="0"
                      role="presentation"
                      style="text-align:center;margin:28px 0">
                      <tbody>
                        <tr>
                          <td>
                            <a
                              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/home"
                              style="line-height:1;text-decoration:none;display:inline-block;max-width:100%;mso-padding-alt:0px;background-color:#db2777;color:#ffffff;padding:14px 32px;border-radius:9999px;font-weight:600;font-size:15px;padding-top:14px;padding-right:32px;padding-bottom:14px;padding-left:32px"
                              target="_blank"
                              ><span
                                ><!--[if mso]><i style="mso-font-width:400%;mso-text-raise:21" hidden>&#8202;&#8202;&#8202;&#8202;</i><![endif]--></span
                              ><span
                                style="max-width:100%;display:inline-block;line-height:120%;mso-padding-alt:0px;mso-text-raise:10.5px"
                                >Confirm new email</span
                              ><span
                                ><!--[if mso]><i style="mso-font-width:400%" hidden>&#8202;&#8202;&#8202;&#8202;&#8203;</i><![endif]--></span
                              ></a
                            >
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <p
                      style="font-size:13px;line-height:20px;color:#52525b;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                      If you did not request this change, please secure your
                      account.
                    </p>
                    <hr
                      style="width:100%;border:none;border-top:1px solid #27272a;margin:32px 0 24px" />
                    <p
                      style="font-size:12px;line-height:18px;color:#71717a;text-align:center;margin:0 0 8px;margin-top:0;margin-right:0;margin-bottom:8px;margin-left:0">
                      Creator Economy 2.0 — The all-in-one monetization platform
                      for modern creators.
                    </p>
                    <p
                      style="font-size:12px;line-height:18px;color:#71717a;text-align:center;margin:0;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
                      <a
                        href="{{ .SiteURL }}"
                        style="color:#a1a1aa;text-decoration-line:none;text-decoration:underline"
                        target="_blank"
                        >Open Blabber</a
                      >
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
    <!--7--><!--/$-->
  </body>
</html>
